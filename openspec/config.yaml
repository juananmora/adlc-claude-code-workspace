# OpenSpec config — datos operativos del workspace
#
# Propósito acotado: este archivo es la referencia rápida de
#   1. tech stack real del repo,
#   2. comandos exactos de cada capa de testing,
#   3. log auditable de decisiones arquitectónicas con commit hash.
#
# Lo que NO contiene (deliberadamente): reglas por fase del flujo ADLC.
# Esas reglas viven SOLO en CLAUDE.md para evitar duplicación y drift.
# Si se necesita el manual completo del flujo, leer CLAUDE.md.
#
# Fuentes de verdad:
#   - 12 fases ADLC y reglas duras: CLAUDE.md (raíz del repo).
#   - Estado vivo por dominio: specs/areas/<area>/spec.md (G/W/T + RFC 2119).
#   - Propuestas de cambio activas: openspec/changes/<slug>/.
#   - Histórico iter-1..iter-7: specs/acceptance-criteria-archive.md (inmutable).
#
# Decisión de alcance: DEC-004 (2026-05-17, commit TBD) reduce este archivo
# a context + testing + history. Razón: la sección `rules` duplicaba CLAUDE.md
# y nadie la consumía automáticamente en este workspace.

schema: spec-driven

# Tech stack real (no aspiraciones) — útil para onboarding rápido.
context: |
  Monorepo ADLC / SDD / Harness Engineering.
  Apps:
    - apps/api  → Fastify 5 + TypeScript 5.6 + Vitest 4 (ESM, port 4000)
    - apps/web  → Next.js 15 + React 19 + Tailwind 3.4 + Playwright 1.60
                  (port 3000, --workers=1 por API single-threaded en dev)
  Infra: Terraform + azurerm ~> 4.0 en infra/ (no se despliega desde el agente).
  Catálogo demo: 22 discos heavy metal + 10 juegos Amstrad CPC + 32 créditos.
  Agentes ejecutores (9): backend-engineer, frontend-engineer, qa-engineer,
                          security-engineer, reviewer, cloud-architect,
                          terraform-engineer, cicd-engineer, observability-engineer.
  Skills (11): ver `.claude/skills/` y CLAUDE.md § Fase 4.
  Orquestación: Claude principal aplica CLAUDE.md directamente
                (no hay agente orquestador dedicado — eliminado en DEC-001).

strict_tdd: false  # honesto: hoy permitimos tests-después. Si se endurece, cambiar a true.

# Estrategia de testing — referencia de comandos exactos por capa.
testing:
  layers:
    unit:
      available: true
      tool: "vitest"
      command: "npm test"
      cwd: "apps/api"
      note: "233/233 verdes a fecha iter-8."

    integration:
      available: true
      tool: "fastify app.inject() + vitest"
      cwd: "apps/api"
      note: "Tests con buildApp + inject para rutas reales."

    e2e:
      available: true
      tool: "Playwright"
      command: "npx playwright test --workers=1"
      cwd: "apps/web"
      note: "46/46 verdes a fecha iter-8. workers=1 obligatorio: API single-threaded en dev provoca timeouts con paralelización default. Deuda iter-4."

    smoke:
      available: true
      tool: "Chrome DevTools MCP"
      note: "Manual desde el chat. Capturas en reports/iter-<N>/. Lee consola y network."

  coverage:
    available: true
    command: "npx vitest run --coverage"
    cwd: "apps/api"

  quality:
    type_checker:
      available: true
      commands:
        - "npx tsc --noEmit  # cwd: apps/api"
        - "npx tsc --noEmit -p tsconfig.json  # cwd: apps/web"

    linter:
      available: true
      command: "next lint"
      cwd: "apps/web"
      note: "ESLint via next/core-web-vitals. No hay linter equivalente en apps/api."

    formatter:
      available: false
      note: "No hay prettier configurado. Estilo manual."

    security_audit:
      available: true
      commands:
        - "npm audit --audit-level=high  # cwd: apps/api"
        - "npm audit --audit-level=high  # cwd: apps/web"
      note: "Gate Fase 7. Baseline 0 vulnerabilities en ambos paquetes."

# Histórico operativo — log auditable de decisiones arquitectónicas.
# Cualquier decisión que cambie cómo se trabaja con este repo entra aquí
# con rationale y commit hash.
history:
  iterations_closed: 10
  last_close: "2026-05-17"  # iter-10 commit TBD

  decisions:
    - id: "DEC-001"
      date: "2026-05-16"
      title: "Eliminar agente adlc-orchestrator"
      rationale: |
        Iter-4 a iter-7 demostraron que delegar la orquestación a un subagente
        aislado añade overhead (sandbox sin Bash, sin tool Agent para sub-sub-agentes,
        doble redacción de prompts) sin valor proporcional. CLAUDE.md ya contiene
        el manual completo y se inyecta siempre. Claude principal orquesta directamente.
      commit: "c03bcfc"

    - id: "DEC-002"
      date: "2026-05-17"
      title: "Adoptar specs/areas/ + openspec/changes/ con G/W/T + RFC 2119"
      rationale: |
        Inspirado en el modelo openspec de gentle-ai. Separa estado vivo del
        producto (specs/areas/<area>/spec.md, declarativo) de propuestas de
        cambio activas (openspec/changes/<slug>/, mutaciones). El archivo
        histórico specs/acceptance-criteria-archive.md mantiene iter-1..iter-7
        inmutable. Las áreas creadas: platform, infra-azure, catalog-products,
        albums, games. Convención G/W/T + RFC 2119 obligatoria a partir de iter-8.
      commit: "e4d5787"

    - id: "DEC-003"
      date: "2026-05-17"
      title: "iter-8: página /about con créditos públicos — mitiga SEC-07-01"
      rationale: |
        Primer change ejecutado con el nuevo modelo (openspec/changes/<slug>/).
        Implementa /about con 32 créditos de portadas (22 albums + 10 games),
        autor + publisher + año + URL Wikipedia. Reduce SEC-07-01 heredado de
        iter-7 (fair use editorial) de MEDIUM a LOW: la atribución pública es
        parte del cumplimiento del fair use. NO cierra el finding: release
        público sigue requiriendo visado legal.

        Gates:
        - security-engineer: APROBADO (0/0/0/0).
        - reviewer: APROBAR con 1 bloqueante resuelta (grep verbos no-RFC 2119
          en specs/areas/{platform,infra-azure,games}: 0 matches).
        - Tests: vitest 233/233, Playwright 46/46, npm audit 0 vulns.
        - Smoke MCP: 0 errores consola, 11/11 network 200.

        Reportes en reports/iter-8/. Verify-report en
        openspec/changes/about-credits/verify-report.md.
      commit: "ea88a5d"

    - id: "DEC-005"
      date: "2026-05-17"
      title: "iter-9: dockerización + lección server components con DNS interno"
      rationale: |
        Empaqueta apps/api y apps/web en imágenes multi-stage (node:22-alpine,
        USER node, healthchecks) orquestadas por docker-compose. Ambas
        imágenes healthy con un único `docker compose up -d`.

        Bug crítico detectado POR EL USUARIO post-cierre (no por el reviewer):
        las fichas /products/[id], /albums/[id], /games/[id] son server
        components y hacían fetch a `localhost:4000` desde dentro del
        contenedor web. Dentro del contenedor, localhost es el propio
        contenedor, no la API. ECONNREFUSED.

        Fix:
        - Nueva función `resolveApiBase()` en `apps/web/lib/api.ts` que
          detecta server-side (typeof window === "undefined") y usa
          API_BASE_URL_INTERNAL (DNS interno de compose, http://api:4000).
        - Refactor de albums-api.ts y games-api.ts para usar el helper
          consolidado (resuelve REC-7 del backlog iter-7 de paso).
        - compose declara API_BASE_URL_INTERNAL=http://api:4000 en el
          service web.

        Lecciones procedimentales registradas en CLAUDE.md § Anti-patrones:
        1. qa-engineer obligatorio TAMBIÉN en iters de infraestructura.
           Me lo salté pensando "no hay cambios funcionales". El bug
           pudo haberse pillado con tests E2E contra el nuevo entorno.
        2. Smoke MCP debe cubrir TODAS las rutas con server components,
           no solo el listado.
        3. Cambios de infra (Docker, deploy) requieren re-ejecutar
           Playwright contra el nuevo entorno, no contra el host de dev.

        Verificación final tras fix:
        - Playwright 46/46 verde CONTRA DOCKER (no solo host).
        - Smoke MCP en /products/mbp-16-m4-pro, /albums/metallica-master-of-puppets,
          /games/knight-lore: 0 errores consola en las 3.
        - Healthchecks vuelven a healthy tras docker compose stop && start.

        Gates:
        - security-engineer: APROBADO CON OBSERVACIONES (0 CRITICAL/HIGH,
          2 MEDIUM no bloqueantes, 4 LOW). Findings: API image 398MB
          excede objetivo (devDeps en runtime), falta hardening compose.
        - reviewer: APROBAR con observaciones no bloqueantes (antes del
          descubrimiento del bug; tras el fix, suite Playwright contra
          Docker 46/46 verde).

        Reportes en reports/iter-9/. Verify-report en
        openspec/changes/dockerize/verify-report.md.
      commit: "e37d0e7"

    - id: "DEC-004"
      date: "2026-05-17"
      title: "Reducir openspec/config.yaml: eliminar sección rules (duplicaba CLAUDE.md)"
      rationale: |
        El archivo tenía una sección `rules.<fase>` con invariantes por fase
        del flujo ADLC que duplicaba lo que ya está en CLAUDE.md como prosa.
        Nadie la consumía automáticamente: ni el script de validación, ni
        CI, ni el LLM (no se inyecta sin pedirlo explícitamente). En la
        práctica era ruido mantenible que arriesgaba divergencia con
        CLAUDE.md.

        Decisión: el archivo se reduce a tres bloques con consumidor real:
        - context: onboarding rápido del tech stack.
        - testing: referencia exacta de comandos por capa.
        - history.decisions[]: log auditable con commit hash.

        Las reglas operativas viven SOLO en CLAUDE.md a partir de aquí.
      commit: "6a357eb"

    - id: "DEC-006"
      date: "2026-05-17"
      title: "iter-10: nueva área `consoles` con 10 videoconsolas icónicas"
      rationale: |
        Añade sección `/consoles` al portal IRON DECK: 10 consolas históricas
        (NES 1983 → Wii 2006), con catálogo + ficha de detalle. Es el primer
        change ejecutado end-to-end con todas las lecciones acumuladas desde
        iter-7 aplicadas de entrada:
        - G/W/T + RFC 2119 desde el primer minuto (DEC-002).
        - resolveApiBase() en el cliente HTTP desde el primer minuto
          (DEC-005: SSR en Docker funciona sin parches post-cierre).
        - qa-engineer obligatorio (post-DEC-005 anti-pattern).
        - Smoke MCP en listado + 2 fichas distintas + 404 (post-DEC-005).
        - Playwright ejecutado contra Docker, no contra host (post-DEC-005).
        - encodeURIComponent(id) en path params desde el inicio (cierre
          preventivo del patrón SEC-10-L1 detectado por security-engineer).

        Entregables:
        - apps/api: types/console.ts, data/consoles.ts (10 entradas),
          routes/consoles.ts (GET /consoles?q&manufacturer&generation,
          GET /consoles/:id), tests/consoles.test.ts (127 tests).
        - apps/web: lib/console-types.ts, lib/consoles-api.ts (con
          resolveApiBase + encodeURIComponent), app/consoles/{layout,
          page, [id]/page, [id]/not-found}.tsx, components/{console-card,
          consoles-grid}.tsx, components/iron-deck-header.tsx (link
          "Consolas" entre "Games" y "About").
        - apps/web/e2e/consoles.spec.ts (8 tests).
        - apps/web/public/covers/consoles/*.jpg (10 portadas Wikipedia,
          7-53 KB cada una, fair use editorial).

        Gates:
        - vitest backend: 360/360 verdes (127 nuevos + 233 previos).
        - tsc frontend: exit 0 sin output.
        - Playwright contra Docker: 54/54 verdes (8 nuevos + 46 previos).
        - Smoke MCP: 0 errores consola en /consoles, /consoles/nintendo-64,
          /consoles/playstation-2, /consoles/unknown-xxx.
        - security-engineer: APROBADO CON OBSERVACIONES. 0 CRITICAL,
          0 HIGH, 0 MEDIUM, 1 LOW (SEC-10-L1) cerrado en el mismo iter.
        - reviewer: APROBAR.

        Hallazgos vivos al cierre:
        - SEC-9-M1 (MEDIUM heredado): imagen API 398MB > 300MB.
          Diferido a iter-11 (deps-prod stage con npm ci --omit=dev).

        Specs movidas tras cierre:
        - openspec/changes/consoles/specs/consoles.md → specs/areas/consoles/spec.md.

        Reportes en reports/iter-10/. Verify-report en
        openspec/changes/consoles/verify-report.md.
      commit: "TBD"
