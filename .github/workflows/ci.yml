# CI workflow — valida PRs y pushes a main para apps/api, apps/web e infra.
# Filtros por path evitan correr todos los jobs si un PR no toca cada app.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permisos mínimos por defecto; cada job sube lo que necesite.
permissions:
  contents: read

jobs:
  # Detecta qué partes del monorepo cambiaron para condicionar el resto de jobs.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  api:
    name: API — build & test
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  web:
    name: Web — lint & build
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Placeholder build-time; el valor real se inyecta en deploy por entorno.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Necesario para que gitleaks pueda escanear el historial del PR.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Umbral moderate tras el security gate de la iteración 2: vulns moderate
      # en cadenas productivas (next/postcss XSS, vite path traversal) deben
      # bloquear el merge. Cualquier excepción requiere aprobación humana
      # documentada en el PR.
      - name: npm audit — api
        working-directory: apps/api
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: npm audit — web
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: Dependency review
        # Solo aplica en PRs (compara base vs head). En push directo no tiene sentido.
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Gitleaks — scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  iac-lint:
    name: IaC lint
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Terraform files
        id: tfcheck
        # Si todavía no hay .tf, no hay nada que validar (Terraform real llegará después).
        run: |
          if find infra -type f -name '*.tf' | grep -q .; then
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "No .tf files found under infra/ — skipping terraform fmt."
          fi

      - name: Setup Terraform
        if: steps.tfcheck.outputs.has_tf == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Terraform fmt
        if: steps.tfcheck.outputs.has_tf == 'true'
        run: terraform fmt -check -recursive infra
